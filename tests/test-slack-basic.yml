name: Test basic Slack provider usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook-url: 'https://hooks.slack.com/services/FAKE/FAKE/FAKE'
          provider: 'slack'
          channel: '#general'

      - name: Assert action was invoked (may fail due to invalid token/webhook)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail due to API/network issues,
          # not due to missing required inputs. Both outcomes are acceptable here.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked correctly"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
