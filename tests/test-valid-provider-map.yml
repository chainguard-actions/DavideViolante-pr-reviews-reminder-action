name: Test valid github-provider-map format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          webhook-url: 'https://hooks.slack.com/services/fake/webhook/url'
          provider: 'slack'
          channel: '#reviews'
          github-provider-map: 'DavideViolante:UABCDEFGH,foobar123:UIHJKLMNO'
        continue-on-error: true
      - name: Assert action ran with valid provider map
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should accept the valid github-provider-map format.
          # If no PRs need review, it succeeds without hitting the webhook.
          # If PRs exist, it tries the webhook (which may fail with fake URL).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with valid provider map (no PRs needing review)"
          else
            echo "INFO: action attempted notification (PRs exist), webhook unreachable with fake URL"
            echo "PASS: action ran with valid provider map format"
          fi
