name: Test ignore-label input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run PR reviews reminder action with ignore-label
        id: action
        continue-on-error: true
        uses: .
        with:
          webhook-url: 'https://httpbin.org/post'
          provider: 'slack'
          channel: '#general'
          github-provider-map: ''
          ignore-label: 'wip'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert action ran without unexpected failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should handle the ignore-label input without crashing.
          # It will filter out PRs with the 'wip' label before sending notifications.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
