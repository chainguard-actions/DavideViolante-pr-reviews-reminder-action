name: Test ignore-label input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock webhook server
        run: |
          python3 -c "
          import http.server, socketserver, threading

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  self.rfile.read(length)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'ok')
              def log_message(self, fmt, *args):
                  pass

          socketserver.TCPServer.allow_reuse_address = True
          httpd = socketserver.TCPServer(('0.0.0.0', 9995), Handler)
          t = threading.Thread(target=httpd.serve_forever)
          t.daemon = True
          t.start()
          import time; time.sleep(86400)
          " &
          sleep 2
          curl -sf -X POST http://127.0.0.1:9995/test -d '{}' -H 'Content-Type: application/json' && echo "Mock server OK" || echo "Mock server not responding (will continue)"

      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook-url: 'http://127.0.0.1:9995/webhook'
          provider: 'slack'
          channel: '#general'
          ignore-label: 'wip'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran with ignore-label
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with ignore-label set (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
